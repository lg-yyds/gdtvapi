name: 更新 1989.m3u

on:
  schedule:
    - cron: "0 2 * * *"  # 每天 10:00（北京时间）运行
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载并过滤 playlist
        env:
          PLAYLIST_URL: https://iptv.yang-1989.xyz/playlist.m3u
        run: |
          python3 << 'EOF'
          import os, sys, urllib.request

          url = os.environ["PLAYLIST_URL"]
          # #EXTINF 行里出现以下任一关键词，就删掉整段（含紧随其后的播放地址行）
          KEYWORDS = ["免費訂閲", "請勿販賣", "溫馨提示"]

          print(f"下载: {url}")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              raw = urllib.request.urlopen(req, timeout=60).read()
          except Exception as e:
              sys.exit(f"下载失败: {e}")

          lines = raw.decode("utf-8-sig").splitlines()
          kept, i, removed = [], 0, 0
          while i < len(lines):
              line = lines[i]
              if line.startswith("#EXTINF") and any(k in line for k in KEYWORDS):
                  removed += 1
                  i += 1
                  while i < len(lines) and not lines[i].startswith("#"):
                      i += 1
                  continue
              kept.append(line)
              i += 1

          os.makedirs("output", exist_ok=True)
          with open("output/1989.m3u", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(kept).rstrip("\n") + "\n")
          print(f"完成: 删除 {removed} 段提示，剩余 {len(kept)} 行 -> output/1989.m3u")
          EOF

      - name: 提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/1989.m3u
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
          else
            git commit -m "chore: 更新 1989.m3u"
            git push
          fi
