name: Merge live.txt into result files (smart insert)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sources
        run: |
          mkdir -p tmp output
          curl -sL "https://raw.githubusercontent.com/dongtian00/box/refs/heads/520/lib/live.txt" -o tmp/live.txt
          curl -sL "https://raw.githubusercontent.com/lg-yyds/gdtvapi/refs/heads/master/output/result.m3u" -o tmp/result.m3u
          curl -sL "https://raw.githubusercontent.com/lg-yyds/gdtvapi/refs/heads/master/output/result.txt" -o tmp/result.txt

      - name: Smart merge
        run: |
          python3 << 'PY'
          # -*- coding: utf-8 -*-
          from pathlib import Path
          from collections import defaultdict, OrderedDict
          import re

          # ========== 1. 解析 live.txt ==========
          live_raw = Path("tmp/live.txt").read_text(encoding="utf-8", errors="ignore")
          live_groups = OrderedDict()          # group -> [(name, url), ...]
          current = "未分类"

          for line in live_raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              if ",#genre#" in line:
                  current = line.split(",")[0].strip()
                  live_groups.setdefault(current, [])
                  continue
              if "," in line:
                  name, url = line.split(",", 1)
                  name, url = name.strip(), url.strip()
                  if name and url and re.match(r'^(https?|rtmp|rtsp|video|webview)://', url, re.I):
                      live_groups.setdefault(current, []).append((name, url))

          # 频道名 -> 去重后的 url 列表
          live_by_name = defaultdict(list)
          for items in live_groups.values():
              for name, url in items:
                  if url not in live_by_name[name]:
                      live_by_name[name].append(url)

          print(f"live.txt → {sum(len(v) for v in live_groups.values())} 源, {len(live_groups)} 分组")

          # ========== 2. 分组映射 ==========
          GROUP_MAP = {
              "央视": "📺央视频道",
              "卫视": "📡卫视频道",
              "港澳频道": "🌊港·澳·台",
              "台湾频道": "🌊港·澳·台",
              "极速港台": "🌊港·澳·台",
              "极速港台2": "🌊港·澳·台",
              "四季台湾": "🌊港·澳·台",
              "四季台湾2": "🌊港·澳·台",
              "四季台湾3": "🌊港·澳·台",
              "广东": "☘️广东频道",
              "浙江": "☘️浙江频道",
              "江苏": "☘️江苏频道",
              "上海": "☘️上海频道",
              "北京": "☘️北京频道",
              "福建": "☘️福建频道",
              "湖南": "☘️湖南频道",
              "湖北": "☘️湖北频道",
              "四川": "☘️四川频道",
              "山东": "☘️山东频道",
              "安徽": "☘️安徽频道",
              "河南": "☘️河南频道",
              "河北": "☘️河北频道",
              "辽宁": "☘️辽宁频道",
              "吉林": "☘️吉林频道",
              "黑龙江": "☘️黑龙江频道",
              "陕西": "☘️陕西频道",
              "山西": "☘️山西频道",
              "云南": "☘️云南频道",
              "贵州": "☘️贵州频道",
              "广西": "☘️广西频道",
              "海南": "☘️海南频道",
              "甘肃": "☘️甘肃频道",
              "新疆": "☘️新疆频道",
              "内蒙古": "☘️内蒙古频道",
              "宁夏": "☘️宁夏频道",
              "青海": "☘️青海频道",
              "天津": "☘️天津频道",
              "重庆": "☘️重庆频道",
              "虎牙": "虎牙",
              "轮播": "轮播",
          }

          # ========== 3. 处理 result.txt ==========
          txt_lines = Path("tmp/result.txt").read_text(encoding="utf-8", errors="ignore").splitlines()

          new_txt = []
          used = set()          # (name, url) 已使用

          i = 0
          while i < len(txt_lines):
              line = txt_lines[i]
              new_txt.append(line)

              if "," in line and not line.strip().endswith("#genre#"):
                  name = line.split(",", 1)[0].strip()
                  if name in live_by_name:
                      for url in live_by_name[name]:
                          key = (name, url)
                          if key not in used:
                              # 防止紧邻重复
                              if not any(l.strip() == f"{name},{url}" for l in new_txt[-15:]):
                                  new_txt.append(f"{name},{url}")
                              used.add(key)
              i += 1

          # ---- 收集真正剩余的源，按最终分组归类 ----
          remaining_by_group = OrderedDict()   # final_group -> [(name, url), ...]

          for live_g, items in live_groups.items():
              final_g = GROUP_MAP.get(live_g, live_g)
              for name, url in items:
                  key = (name, url)
                  if key not in used:
                      remaining_by_group.setdefault(final_g, []).append((name, url))
                      used.add(key)

          # ---- 只追加「原文件中不存在」的分组抬头，且每个抬头只写一次 ----
          existing_headers = set()
          for line in new_txt:
              if line.strip().endswith("#genre#"):
                  existing_headers.add(line.strip())

          for final_g, items in remaining_by_group.items():
              if not items:
                  continue
              header = f"{final_g},#genre#"
              if header not in existing_headers:
                  new_txt.append("")
                  new_txt.append(header)
                  existing_headers.add(header)
              # 去重写入
              seen = set()
              for name, url in items:
                  entry = f"{name},{url}"
                  if entry not in seen:
                      new_txt.append(entry)
                      seen.add(entry)

          Path("output/result_new.txt").write_text("\n".join(new_txt) + "\n", encoding="utf-8")
          print("result_new.txt 完成（无重复抬头）")

          # ========== 4. 处理 result.m3u ==========
          m3u_lines = Path("tmp/result.m3u").read_text(encoding="utf-8", errors="ignore").splitlines()

          new_m3u = []
          used_m3u = set()

          i = 0
          while i < len(m3u_lines):
              line = m3u_lines[i]
              new_m3u.append(line)

              if line.startswith("#EXTINF"):
                  if i + 1 < len(m3u_lines):
                      new_m3u.append(m3u_lines[i + 1])
                      i += 1
                      m = re.search(r',(.+)$', line)
                      if m:
                          name = m.group(1).strip()
                          if name in live_by_name:
                              logo_m = re.search(r'tvg-logo="([^"]*)"', line)
                              group_m = re.search(r'group-title="([^"]*)"', line)
                              logo = logo_m.group(1) if logo_m else ""
                              group = group_m.group(1) if group_m else "其他"
                              for url in live_by_name[name]:
                                  key = (name, url)
                                  if key not in used_m3u:
                                      new_m3u.append(
                                          f'#EXTINF:-1 tvg-name="{name}" tvg-logo="{logo}" group-title="{group}",{name}'
                                      )
                                      new_m3u.append(url)
                                      used_m3u.add(key)
              i += 1

          # 剩余 m3u 频道（同样按最终分组，且不重复）
          remaining_m3u = OrderedDict()
          for live_g, items in live_groups.items():
              final_g = GROUP_MAP.get(live_g, live_g)
              for name, url in items:
                  key = (name, url)
                  if key not in used_m3u:
                      remaining_m3u.setdefault(final_g, []).append((name, url))
                      used_m3u.add(key)

          for final_g, items in remaining_m3u.items():
              if not items:
                  continue
              for name, url in items:
                  logo = f"https://raw.githubusercontent.com/fanmingming/live/main/tv/{name}.png"
                  new_m3u.append(
                      f'#EXTINF:-1 tvg-name="{name}" tvg-logo="{logo}" group-title="{final_g}",{name}'
                  )
                  new_m3u.append(url)

          Path("output/result_new.m3u").write_text("\n".join(new_m3u) + "\n", encoding="utf-8")
          print("result_new.m3u 完成")
          print(f"最终使用 live 源数量: {len(used_m3u)}")
          PY

      - name: Check for duplicate headers
        run: |
          echo "===== 检查 result_new.txt 中重复的 #genre# 抬头 ====="
          grep -E ',#genre#' output/result_new.txt | sort | uniq -c | sort -rn | head -20
          echo ""
          echo "===== 前 50 行预览 ====="
          head -n 50 output/result_new.txt
          echo ""
          ls -lh output/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/result_new.m3u output/result_new.txt
          git diff --staged --quiet || git commit -m "chore: merge live.txt into result_new.m3u and result_new.txt"
          git push
