name: Merge live.txt into result files

on:
  # 手动触发
  workflow_dispatch:
  # 定时触发（每天 UTC 2:00，可按需修改）
  schedule:
    - cron: '0 2 * * *'
  # 也可以在 push 到主分支时触发（可选）
  # push:
  #   branches: [ master, main ]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download live.txt
        run: |
          mkdir -p tmp
          curl -sL "https://raw.githubusercontent.com/dongtian00/box/refs/heads/520/lib/live.txt" -o tmp/live.txt

      - name: Download original result files
        run: |
          mkdir -p output
          curl -sL "https://raw.githubusercontent.com/lg-yyds/gdtvapi/refs/heads/master/output/result.m3u" -o tmp/result.m3u
          curl -sL "https://raw.githubusercontent.com/lg-yyds/gdtvapi/refs/heads/master/output/result.txt" -o tmp/result.txt

      - name: Merge into result_new.txt and result_new.m3u
        run: |
          python3 << 'EOF'
          import re
          from pathlib import Path

          # ========== 读取文件 ==========
          live_content = Path("tmp/live.txt").read_text(encoding="utf-8", errors="ignore")
          result_txt = Path("tmp/result.txt").read_text(encoding="utf-8", errors="ignore")
          result_m3u = Path("tmp/result.m3u").read_text(encoding="utf-8", errors="ignore")

          # ========== 解析 live.txt ==========
          # 格式: 频道名,URL  或  分组,#genre#
          channels = []          # [(name, url), ...]
          current_group = "其他"

          for line in live_content.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.endswith(",#genre#"):
                  current_group = line[:-8].strip()  # 去掉 ,#genre#
                  continue
              if "," in line:
                  # 只取第一个逗号前的名称和后面的 URL
                  name, url = line.split(",", 1)
                  name = name.strip()
                  url = url.strip()
                  if name and url and url.startswith(("http://", "https://", "rtmp://", "rtsp://", "video://", "webview://")):
                      channels.append((name, url, current_group))

          print(f"从 live.txt 解析到 {len(channels)} 个有效频道")

          # ========== 生成 result_new.txt ==========
          # 先写原有内容，再追加 live 的内容（按分组）
          txt_lines = result_txt.rstrip() + "\n\n"

          # 按分组整理 live 频道
          from collections import defaultdict
          group_map = defaultdict(list)
          for name, url, group in channels:
              group_map[group].append(f"{name},{url}")

          for group, items in group_map.items():
              txt_lines += f"{group},#genre#\n"
              # 去重（同一分组内相同 name+url 只保留一次）
              seen = set()
              for item in items:
                  if item not in seen:
                      seen.add(item)
                      txt_lines += item + "\n"
              txt_lines += "\n"

          Path("output/result_new.txt").write_text(txt_lines, encoding="utf-8")
          print("已生成 output/result_new.txt")

          # ========== 生成 result_new.m3u ==========
          # 先写原有内容，再追加 live 转换后的 #EXTINF
          m3u_lines = result_m3u.rstrip() + "\n"

          # 简单 logo 映射（可选，找不到就空）
          def get_logo(name: str) -> str:
              # 常见 CCTV / 卫视 logo（可自行扩展）
              base = "https://raw.githubusercontent.com/fanmingming/live/main/tv/"
              mapping = {
                  "CCTV-1": "CCTV1.png",
                  "CCTV-2": "CCTV2.png",
                  "CCTV-3": "CCTV3.png",
                  "CCTV-4": "CCTV4.png",
                  "CCTV-5": "CCTV5.png",
                  "CCTV-5+": "CCTV5+.png",
                  "CCTV-6": "CCTV6.png",
                  "CCTV-7": "CCTV7.png",
                  "CCTV-8": "CCTV8.png",
                  "CCTV-9": "CCTV9.png",
                  "CCTV-10": "CCTV10.png",
                  "CCTV-11": "CCTV11.png",
                  "CCTV-12": "CCTV12.png",
                  "CCTV-13": "CCTV13.png",
                  "CCTV-14": "CCTV14.png",
                  "CCTV-15": "CCTV15.png",
                  "CCTV-16": "CCTV16.png",
                  "CCTV-17": "CCTV17.png",
              }
              if name in mapping:
                  return base + mapping[name]
              # 简单尝试用频道名
              return base + name + ".png"

          seen_m3u = set()
          for name, url, group in channels:
              key = f"{name}|{url}"
              if key in seen_m3u:
                  continue
              seen_m3u.add(key)

              logo = get_logo(name)
              # 与原 result.m3u 风格保持一致
              m3u_lines += f'#EXTINF:-1 tvg-name="{name}" tvg-logo="{logo}" group-title="{group}",{name}\n'
              m3u_lines += f"{url}\n"

          Path("output/result_new.m3u").write_text(m3u_lines, encoding="utf-8")
          print("已生成 output/result_new.m3u")
          print(f"最终 m3u 共追加 {len(seen_m3u)} 个频道")
          EOF

      - name: Show generated files
        run: |
          ls -lh output/
          echo "----- result_new.txt 前 30 行 -----"
          head -n 30 output/result_new.txt
          echo "----- result_new.m3u 前 30 行 -----"
          head -n 30 output/result_new.m3u

      - name: Commit and push (optional)
        # 如果仓库允许 push，取消下面注释即可自动提交
        # 需要配置 permissions: contents: write
        if: false   # 改成 true 开启自动提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/result_new.m3u output/result_new.txt
          git diff --staged --quiet || git commit -m "Update result_new.m3u and result_new.txt from live.txt"
          git push
